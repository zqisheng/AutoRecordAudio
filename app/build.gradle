plugins {
    id 'com.android.application'
}

android {
    namespace 'com.haha.autorecordaudio'
    compileSdk 29
    defaultConfig {
        applicationId "com.haha.autorecordaudio"
        minSdk 29
        targetSdk 29
        versionCode 1
        versionName "1.0"
    }
    buildFeatures {
        viewBinding false  // 明确禁用
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    //implementation 'com.arthenica:ffmpeg-kit-full-gpl:6.0-2.LTS' // MP3 剪辑转码库
    implementation 'androidx.appcompat:appcompat:1.3.1'
}